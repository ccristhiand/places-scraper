<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="/css/shared.css">
<style>
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.625rem;margin-bottom:.875rem}
.demo-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:.875rem;margin-bottom:.625rem}
.demo-time{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:3px}
.demo-name{font-size:14px;font-weight:600}
.demo-meta{font-size:11px;color:var(--muted);margin-top:3px}
.demo-actions{display:flex;gap:6px;margin-top:.625rem;flex-wrap:wrap}
.nresult{padding:.5rem;border-bottom:1px solid var(--border-s);cursor:pointer;font-size:12px}
.nresult:hover{background:#f8fafc}
@media(max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .layout{flex-direction:column}
  .layout .right{width:100%}
}
</style></head><body>
<div class="page">

<div class="stats" id="statsGrid"></div>

<div style="display:flex;gap:1rem;flex-wrap:wrap" class="layout">
  <!-- Lista demos -->
  <div style="flex:1;min-width:0">
    <div class="card">
      <div class="card-h">
        <h3>📅 Demos</h3>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <input type="date" id="fDesde" class="btn btn-outline btn-sm" style="height:28px;padding:0 8px;font-size:11px" onchange="load()">
          <select id="fEstado" onchange="load()" style="height:28px;border:1px solid var(--border);border-radius:6px;font-size:11px;padding:0 6px">
            <option value="">Todas</option><option value="agendada">Agendadas</option>
            <option value="realizada">Realizadas</option><option value="cancelada">Canceladas</option>
          </select>
          <button class="btn btn-outline btn-sm" onclick="load()">🔄</button>
        </div>
      </div>
      <div id="demosList" style="padding:.625rem"></div>
    </div>
  </div>

  <!-- Formulario nueva demo -->
  <div style="width:320px;flex-shrink:0" class="right">
    <div class="card">
      <div class="card-h"><h3>➕ Agendar demo</h3></div>
      <div class="card-b">
        <div class="field">
          <label>Buscar contacto</label>
          <input id="nSearch" placeholder="Nombre del negocio..." oninput="searchNeg()">
          <div id="nResults" style="display:none;border:1px solid var(--border);border-radius:8px;max-height:120px;overflow-y:auto;margin-top:4px"></div>
          <input type="hidden" id="nId">
          <div id="nSelected" style="font-size:12px;color:var(--accent);margin-top:4px;font-weight:500"></div>
        </div>
        <div class="field"><label>Título</label><input id="dTitulo" placeholder="Demo / Presentación..."></div>
        <div class="field"><label>Fecha y hora</label><input id="dFecha" type="datetime-local"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.625rem">
          <div class="field" style="margin-bottom:0">
            <label>Duración</label>
            <select id="dDuracion"><option value="30">30 min</option><option value="60" selected>1 hora</option><option value="90">1.5h</option><option value="120">2h</option></select>
          </div>
          <div class="field" style="margin-bottom:0">
            <label>Tipo</label>
            <select id="dTipo"><option value="virtual">🖥️ Virtual</option><option value="presencial">🏢 Presencial</option><option value="telefonica">📞 Tel.</option></select>
          </div>
        </div>
        <div class="field" style="margin-top:.75rem"><label>Enlace (Zoom/Meet)</label><input id="dEnlace" placeholder="https://..."></div>
        <div class="field"><label>Responsable</label><input id="dResp" placeholder="Tu nombre"></div>
        <div class="field"><label>Notas</label><textarea id="dNotas" placeholder="Preparar demo de..."></textarea></div>
        <button onclick="guardarDemo()" class="btn btn-primary" style="width:100%;justify-content:center">📅 Agendar</button>
        <p style="font-size:11px;color:var(--faint);text-align:center;margin-top:.5rem">✅ Recordatorio automático por WA 24h y 1h antes</p>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const EST_C={agendada:'b-blue',realizada:'b-green',cancelada:'b-red',reprogramada:'b-yellow'};
const EST_L={agendada:'📅 Agendada',realizada:'✅ Realizada',cancelada:'❌ Cancelada',reprogramada:'🔄 Reprog.'};

async function load(){
  const desde=document.getElementById('fDesde').value, estado=document.getElementById('fEstado').value;
  let url=`/api/demos?${desde?'desde='+desde+'T00:00':''}${estado?'&estado='+estado:''}`;
  const data=await fetch(url).then(r=>r.json()).catch(()=>({rows:[]}));
  const rows=data.rows||[];
  const el=document.getElementById('demosList');
  if(!rows.length){el.innerHTML='<div class="empty"><div class="empty-icon">📅</div><p>Sin demos en este período</p></div>';return;}
  el.innerHTML=rows.map(d=>`
    <div class="demo-card">
      <div class="demo-time">🕐 ${fmt(d.fecha_hora)}</div>
      <div class="demo-name">${d.nombre}</div>
      <div class="demo-meta">${d.tipo} · ${d.duracion_min} min${d.responsable?' · '+d.responsable:''}</div>
      ${d.enlace?`<a href="${d.enlace}" target="_blank" style="font-size:11px;color:var(--accent)">🔗 Abrir enlace</a>`:''}
      <div class="demo-actions">
        <span class="badge ${EST_C[d.estado]||'b-gray'}">${EST_L[d.estado]||d.estado}</span>
        ${d.estado==='agendada'?`
          <button class="btn btn-xs b-green" onclick="cambiar(${d.id},'realizada')" style="border:1px solid #bbf7d0;background:#f0fdf4;color:#15803d">✅ Realizada</button>
          <button class="btn btn-xs b-red" onclick="cambiar(${d.id},'cancelada')" style="border:1px solid #fecaca;background:#fef2f2;color:#dc2626">❌ Cancelar</button>`:''}
        <button class="btn btn-xs btn-outline" onclick="eliminar(${d.id})">🗑️</button>
      </div>
      <div style="font-size:10px;color:var(--faint);margin-top:4px">
        Recordatorios: ${d.recordatorio_24h?'✓ 24h':'○ 24h'} ${d.recordatorio_1h?'✓ 1h':'○ 1h'}
      </div>
    </div>`).join('');
  loadStats();
}

async function loadStats(){
  const data=await fetch('/api/demos').then(r=>r.json()).catch(()=>({rows:[]}));
  const rows=data.rows||[];
  const ag=rows.filter(r=>r.estado==='agendada').length;
  const re=rows.filter(r=>r.estado==='realizada').length;
  const ca=rows.filter(r=>r.estado==='cancelada').length;
  document.getElementById('statsGrid').innerHTML=[
    {n:rows.length,l:'Total demos'},{n:ag,l:'Agendadas',c:'color:var(--accent)'},{n:re,l:'Realizadas',c:'color:var(--green)'},{n:ca,l:'Canceladas',c:'color:var(--red)'}
  ].map(s=>`<div class="stat"><div class="stat-n" ${s.c?'style="'+s.c+'"':''}>${s.n}</div><div class="stat-l">${s.l}</div></div>`).join('');
}

async function cambiar(id,estado){
  await fetch(`/api/demos/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado})});
  load();
}
async function eliminar(id){
  if(!confirm('¿Eliminar esta demo?'))return;
  await fetch(`/api/demos/${id}`,{method:'DELETE'});
  load();
}

async function searchNeg(){
  const q=document.getElementById('nSearch').value.trim();
  if(q.length<2){document.getElementById('nResults').style.display='none';return;}
  const data=await fetch(`/api/negocios?q=${encodeURIComponent(q)}&limit=6`).then(r=>r.json()).catch(()=>({rows:[]}));
  const el=document.getElementById('nResults');
  el.style.display='block';
  el.innerHTML=(data.rows||[]).map(r=>`<div class="nresult" onclick="selNeg(${r.id},'${r.nombre.replace(/'/g,"\\'")}','${r.telefono||''}')"><b>${r.nombre}</b><br><span style="color:var(--faint)">${r.telefono||''} · ${r.distrito||''}</span></div>`).join('');
}
function selNeg(id,nombre,tel){
  document.getElementById('nId').value=id;
  document.getElementById('nSelected').textContent='✓ '+nombre;
  document.getElementById('nSearch').value=nombre;
  document.getElementById('nResults').style.display='none';
}
async function guardarDemo(){
  const nId=document.getElementById('nId').value;
  if(!nId) return alert('Selecciona un contacto');
  const fecha=document.getElementById('dFecha').value;
  if(!fecha) return alert('Selecciona fecha y hora');
  const body={negocio_id:+nId,titulo:document.getElementById('dTitulo').value||'Demo',fecha_hora:fecha,
    duracion_min:+document.getElementById('dDuracion').value,tipo:document.getElementById('dTipo').value,
    enlace:document.getElementById('dEnlace').value,responsable:document.getElementById('dResp').value,notas:document.getElementById('dNotas').value};
  const r=await fetch('/api/demos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!d.ok) return alert('Error: '+d.error);
  ['dTitulo','dFecha','dEnlace','dResp','dNotas','nSearch','nId'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('nSelected').textContent='';
  alert('✅ Demo agendada. Recordatorio automático activado por WhatsApp.');
  load();
}
function fmt(dt){return new Date(dt).toLocaleString('es-PE',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}

const hoy=new Date(); document.getElementById('fDesde').value=hoy.toISOString().slice(0,10);
load();
</script></body></html>
