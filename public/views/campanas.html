<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="/css/shared.css">
<style>
.layout{display:flex;gap:1rem;padding:1rem}
.left{width:300px;flex-shrink:0}
.right{flex:1;min-width:0}
.camp-item{padding:.875rem;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;margin-bottom:.625rem;transition:all .15s}
.camp-item:hover{border-color:#93c5fd;background:#f8fafc}
.camp-item.active{border-color:var(--accent);background:#eff6ff}
.camp-name{font-size:13px;font-weight:600;margin-bottom:3px}
.camp-prev{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp-img{width:38px;height:38px;border-radius:6px;object-fit:cover;flex-shrink:0}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin-top:.5rem}
.var-tag{padding:3px 8px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:5px;font-size:11px;color:#1d4ed8;cursor:pointer;font-family:monospace}
.var-tag:hover{background:#dbeafe}
.wa-preview{background:#e5ddd5;border-radius:10px;padding:1rem;min-height:150px}
.wa-bubble{background:#fff;border-radius:0 10px 10px 10px;padding:.75rem 1rem;max-width:90%;display:inline-block;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.wa-text{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.drop-area{border:2px dashed #cbd5e1;border-radius:10px;padding:1.25rem;text-align:center;cursor:pointer;transition:all .15s}
.drop-area:hover,.drop-area.drag{border-color:var(--accent);background:#f8fafc}
@media(max-width:768px){
  .layout{flex-direction:column}
  .left{width:100%}
}
</style></head><body>
<div class="layout">

<div class="left">
  <div class="card">
    <div class="card-h"><h3>📝 Campañas</h3><button class="btn btn-primary btn-sm" onclick="nueva()">+ Nueva</button></div>
    <div style="padding:.75rem" id="listaCampanas">
      <div style="text-align:center;padding:1.5rem;color:var(--faint);font-size:12px">Cargando...</div>
    </div>
  </div>
</div>

<div class="right">
  <div class="card">
    <div class="card-h">
      <h3 id="editorTitle">✏️ Nueva campaña</h3>
      <div style="display:flex;gap:6px">
        <button class="btn btn-outline btn-sm" onclick="cancelar()">Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="guardar()">💾 Guardar</button>
      </div>
    </div>
    <div class="card-b">
      <div class="field"><label>Nombre de la campaña</label><input id="cNombre" placeholder="Ej: Presentación inicial veterinarias"></div>
      <div class="field">
        <label>Mensaje <span style="color:var(--faint);font-weight:400;text-transform:none">(usa las variables de abajo)</span></label>
        <textarea id="cMensaje" placeholder="Hola {{nombre}}, somos..." oninput="updatePreview()" style="min-height:140px"></textarea>
      </div>
      <div style="margin-bottom:.875rem">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Variables</div>
        <div class="vars">
          <span class="var-tag" onclick="insertVar('{{nombre}}')">{{nombre}}</span>
          <span class="var-tag" onclick="insertVar('{{telefono}}')">{{telefono}}</span>
          <span class="var-tag" onclick="insertVar('{{distrito}}')">{{distrito}}</span>
          <span class="var-tag" onclick="insertVar('{{provincia}}')">{{provincia}}</span>
        </div>
      </div>
      <div class="field">
        <label>Imagen (opcional)</label>
        <div class="drop-area" id="dropArea" onclick="document.getElementById('imgInput').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)">
          <div id="dropLabel">📎 Toca o arrastra imagen aquí<br><span style="font-size:11px;color:var(--faint)">JPG, PNG — máx. 10MB</span></div>
          <img id="imgPreviewSmall" style="max-height:80px;border-radius:6px;display:none;margin:0 auto">
        </div>
        <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
        <button id="btnQuitarImg" onclick="quitarImg()" style="display:none;margin-top:4px;width:100%;height:28px;font-size:11px;background:#fef2f2;border:1px solid #fecaca;color:var(--red);border-radius:6px;cursor:pointer">✕ Quitar imagen</button>
      </div>
      <div style="margin-top:.875rem">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Vista previa</div>
        <div class="wa-preview">
          <div class="wa-bubble">
            <img id="prevImg" style="display:none;width:100%;border-radius:6px;margin-bottom:.5rem">
            <div class="wa-text" id="prevText">Tu mensaje aparecerá aquí...</div>
            <div style="font-size:10px;color:var(--faint);text-align:right;margin-top:4px">12:34 ✓✓</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
let campanas=[], editId=null, imgFile=null;

async function loadCampanas(){
  const data=await fetch('/api/campanas').then(r=>r.json()).catch(()=>({rows:[]}));
  campanas=data.rows||[];
  const el=document.getElementById('listaCampanas');
  el.innerHTML=campanas.length?campanas.map(c=>`
    <div class="camp-item" id="ci_${c.id}" onclick="editarCampana(${c.id})">
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div class="camp-name">${c.nombre}</div>
          <div class="camp-prev">${c.mensaje}</div>
          <div style="display:flex;gap:4px;margin-top:6px">
            <button class="btn btn-outline btn-xs" onclick="event.stopPropagation();editarCampana(${c.id})">✏️ Editar</button>
            <button class="btn btn-xs" onclick="event.stopPropagation();eliminar(${c.id})" style="background:#fef2f2;border:1px solid #fecaca;color:var(--red)">🗑️</button>
          </div>
        </div>
        ${c.imagen_url?`<img src="${c.imagen_url}" class="camp-img">`:''}
      </div>
    </div>`).join(''):`<div style="text-align:center;padding:1.5rem;color:var(--faint);font-size:12px">Sin campañas. Crea la primera.</div>`;
}

function nueva(){ editId=null; imgFile=null; document.getElementById('editorTitle').textContent='✏️ Nueva campaña'; document.getElementById('cNombre').value=''; document.getElementById('cMensaje').value=''; quitarImg(); updatePreview(); document.querySelectorAll('.camp-item').forEach(i=>i.classList.remove('active')); }
function cancelar(){ nueva(); }
function editarCampana(id){
  const c=campanas.find(x=>x.id===id); if(!c)return;
  editId=id; imgFile=null;
  document.getElementById('editorTitle').textContent='✏️ Editar: '+c.nombre;
  document.getElementById('cNombre').value=c.nombre;
  document.getElementById('cMensaje').value=c.mensaje;
  document.querySelectorAll('.camp-item').forEach(i=>i.classList.remove('active'));
  document.getElementById('ci_'+id)?.classList.add('active');
  if(c.imagen_url){ document.getElementById('prevImg').src=c.imagen_url; document.getElementById('prevImg').style.display='block'; document.getElementById('imgPreviewSmall').src=c.imagen_url; document.getElementById('imgPreviewSmall').style.display='block'; document.getElementById('dropLabel').style.display='none'; document.getElementById('btnQuitarImg').style.display=''; }
  else { quitarImg(); }
  updatePreview();
}
async function guardar(){
  const nombre=document.getElementById('cNombre').value.trim(), mensaje=document.getElementById('cMensaje').value.trim();
  if(!nombre||!mensaje) return alert('Nombre y mensaje requeridos');
  const fd=new FormData(); fd.append('nombre',nombre); fd.append('mensaje',mensaje);
  if(imgFile) fd.append('imagen',imgFile);
  const r=await fetch(editId?`/api/campanas/${editId}`:'/api/campanas',{method:editId?'PUT':'POST',body:fd});
  const d=await r.json(); if(!d.ok) return alert('Error: '+d.error);
  loadCampanas(); if(!editId) nueva();
}
async function eliminar(id){ if(!confirm('¿Eliminar?'))return; await fetch(`/api/campanas/${id}`,{method:'DELETE'}); loadCampanas(); nueva(); }
function insertVar(v){ const ta=document.getElementById('cMensaje'); const pos=ta.selectionStart; ta.value=ta.value.slice(0,pos)+v+ta.value.slice(ta.selectionEnd); ta.focus(); updatePreview(); }
function updatePreview(){ const msg=document.getElementById('cMensaje').value||'Tu mensaje aquí...'; document.getElementById('prevText').textContent=msg.replace(/{{nombre}}/g,'[Nombre]').replace(/{{telefono}}/g,'[Tel]').replace(/{{distrito}}/g,'[Distrito]').replace(/{{provincia}}/g,'[Provincia]'); }
function handleFile(file){ if(!file)return; imgFile=file; const url=URL.createObjectURL(file); document.getElementById('prevImg').src=url; document.getElementById('prevImg').style.display='block'; document.getElementById('imgPreviewSmall').src=url; document.getElementById('imgPreviewSmall').style.display='block'; document.getElementById('dropLabel').style.display='none'; document.getElementById('btnQuitarImg').style.display=''; }
function handleDrop(e){ e.preventDefault(); document.getElementById('dropArea').classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) handleFile(f); }
function quitarImg(){ imgFile=null; document.getElementById('prevImg').style.display='none'; document.getElementById('imgPreviewSmall').style.display='none'; document.getElementById('dropLabel').style.display=''; document.getElementById('btnQuitarImg').style.display='none'; document.getElementById('imgInput').value=''; }
loadCampanas();
</script></body></html>
