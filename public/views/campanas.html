<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#1e293b;padding:1.25rem;display:flex;gap:1rem;height:100vh;overflow:hidden}
.left{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:1rem;overflow-y:auto}
.right{flex:1;display:flex;flex-direction:column;gap:1rem;overflow-y:auto}
.card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden}
.card-h{padding:.75rem 1.25rem;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:13px;font-weight:600}
.card-b{padding:1rem}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:.75rem}
.f label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
.f input,.f textarea,.f select{border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;color:#1e293b}
.f input:focus,.f textarea:focus{outline:none;border-color:#3b82f6}
.f textarea{resize:vertical;min-height:120px}
.btn{height:34px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-outline{background:#fff;border:1px solid #e2e8f0;color:#374151}.btn-outline:hover{background:#f8fafc}
.btn-red{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
.btn-sm{height:26px;padding:0 8px;font-size:11px}
.camp-item{padding:.875rem;border-radius:10px;border:1px solid #e2e8f0;cursor:pointer;transition:all .15s;margin-bottom:.625rem}
.camp-item:hover{border-color:#93c5fd;background:#f8fafc}
.camp-item.active{border-color:#3b82f6;background:#eff6ff}
.camp-name{font-size:13px;font-weight:600;margin-bottom:3px}
.camp-prev{font-size:11px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp-img{width:40px;height:40px;border-radius:6px;object-fit:cover;margin-left:auto;flex-shrink:0}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin-top:.5rem}
.var-tag{padding:3px 8px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:5px;font-size:11px;color:#1d4ed8;cursor:pointer;font-family:monospace}
.var-tag:hover{background:#dbeafe}
/* Preview WhatsApp style */
.wa-preview{background:#e5ddd5;border-radius:10px;padding:1rem;min-height:200px}
.wa-bubble{background:#fff;border-radius:0 10px 10px 10px;padding:.75rem 1rem;max-width:85%;display:inline-block;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.wa-bubble img{width:100%;border-radius:6px;margin-bottom:.5rem}
.wa-text{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.wa-time{font-size:10px;color:#94a3b8;text-align:right;margin-top:4px}
.drop-area{border:2px dashed #cbd5e1;border-radius:10px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .15s}
.drop-area:hover{border-color:#3b82f6;background:#f8fafc}
.drop-area.drag{border-color:#3b82f6;background:#eff6ff}
</style></head><body>

<div class="left">
  <div class="card">
    <div class="card-h"><h3>📝 Mis campañas</h3><button class="btn btn-primary btn-sm" onclick="nueva()">+ Nueva</button></div>
    <div class="card-b" id="listaCampanas" style="padding:.75rem">
      <div style="text-align:center;padding:1.5rem;color:#94a3b8;font-size:13px">Cargando...</div>
    </div>
  </div>
</div>

<div class="right">
  <div class="card" id="editorCard">
    <div class="card-h">
      <h3 id="editorTitle">✏️ Nueva campaña</h3>
      <div style="display:flex;gap:6px">
        <button class="btn btn-outline btn-sm" onclick="cancelar()">Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="guardar()">💾 Guardar</button>
      </div>
    </div>
    <div class="card-b" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <div>
        <div class="f"><label>Nombre de la campaña</label><input id="cNombre" placeholder="Ej: Presentación inicial veterinarias"></div>
        <div class="f">
          <label>Mensaje <span style="color:#94a3b8;font-weight:400;text-transform:none">(usa variables abajo)</span></label>
          <textarea id="cMensaje" placeholder="Hola {{nombre}}, somos..." oninput="updatePreview()"></textarea>
        </div>
        <div>
          <div style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Variables disponibles</div>
          <div class="vars">
            <span class="var-tag" onclick="insertVar('{{nombre}}')">{{nombre}}</span>
            <span class="var-tag" onclick="insertVar('{{telefono}}')">{{telefono}}</span>
            <span class="var-tag" onclick="insertVar('{{distrito}}')">{{distrito}}</span>
            <span class="var-tag" onclick="insertVar('{{provincia}}')">{{provincia}}</span>
            <span class="var-tag" onclick="insertVar('{{departamento}}')">{{departamento}}</span>
          </div>
        </div>
        <div class="f" style="margin-top:1rem">
          <label>Imagen (opcional)</label>
          <div class="drop-area" id="dropArea" onclick="document.getElementById('imgInput').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)">
            <div id="dropLabel">📎 Clic o arrastra una imagen aquí<br><span style="font-size:11px;color:#94a3b8">JPG, PNG, GIF — máx. 10MB</span></div>
            <img id="imgPreviewSmall" style="max-height:80px;border-radius:6px;display:none;margin:0 auto">
          </div>
          <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
          <button id="btnQuitarImg" onclick="quitarImg()" style="display:none;margin-top:4px;height:24px;font-size:11px;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:5px;cursor:pointer">✕ Quitar imagen</button>
        </div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Vista previa WhatsApp</div>
        <div class="wa-preview">
          <div class="wa-bubble">
            <img id="prevImg" style="display:none">
            <div class="wa-text" id="prevText">Tu mensaje aparecerá aquí...</div>
            <div class="wa-time">12:34 ✓✓</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let campanas=[], editId=null, imgFile=null, imgUrlExistente=null;

async function loadCampanas(){
  const data=await fetch('/api/campanas').then(r=>r.json()).catch(()=>({rows:[]}));
  campanas=data.rows||[];
  const el=document.getElementById('listaCampanas');
  el.innerHTML=campanas.length?campanas.map(c=>`
    <div class="camp-item" id="ci_${c.id}" onclick="editarCampana(${c.id})">
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div class="camp-name">${c.nombre}</div>
          <div class="camp-prev">${c.mensaje}</div>
          <div style="display:flex;gap:4px;margin-top:6px">
            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();editarCampana(${c.id})">✏️ Editar</button>
            <button class="btn btn-red btn-sm" onclick="event.stopPropagation();eliminar(${c.id})">🗑️</button>
          </div>
        </div>
        ${c.imagen_url?`<img src="${c.imagen_url}" class="camp-img">`:''}
      </div>
    </div>`).join(''):`<div style="text-align:center;padding:1.5rem;color:#94a3b8;font-size:13px">Sin campañas aún. Crea la primera.</div>`;
}

function nueva(){ editId=null; imgFile=null; imgUrlExistente=null;
  document.getElementById('editorTitle').textContent='✏️ Nueva campaña';
  document.getElementById('cNombre').value=''; document.getElementById('cMensaje').value='';
  quitarImg(); updatePreview();
  document.querySelectorAll('.camp-item').forEach(i=>i.classList.remove('active'));
}

function cancelar(){ nueva(); }

function editarCampana(id){
  const c=campanas.find(x=>x.id===id); if(!c)return;
  editId=id; imgFile=null; imgUrlExistente=c.imagen_url;
  document.getElementById('editorTitle').textContent='✏️ Editar: '+c.nombre;
  document.getElementById('cNombre').value=c.nombre;
  document.getElementById('cMensaje').value=c.mensaje;
  document.querySelectorAll('.camp-item').forEach(i=>i.classList.remove('active'));
  document.getElementById('ci_'+id)?.classList.add('active');
  if(c.imagen_url){ document.getElementById('prevImg').src=c.imagen_url; document.getElementById('prevImg').style.display='block'; document.getElementById('imgPreviewSmall').src=c.imagen_url; document.getElementById('imgPreviewSmall').style.display='block'; document.getElementById('dropLabel').style.display='none'; document.getElementById('btnQuitarImg').style.display=''; }
  else { quitarImg(); }
  updatePreview();
}

async function guardar(){
  const nombre=document.getElementById('cNombre').value.trim(), mensaje=document.getElementById('cMensaje').value.trim();
  if(!nombre||!mensaje) return alert('Nombre y mensaje son requeridos');
  const fd=new FormData(); fd.append('nombre',nombre); fd.append('mensaje',mensaje);
  if(imgFile) fd.append('imagen',imgFile);
  const url=editId?`/api/campanas/${editId}`:'/api/campanas';
  const method=editId?'PUT':'POST';
  const r=await fetch(url,{method,body:fd});
  const data=await r.json(); if(!data.ok) return alert('Error: '+data.error);
  loadCampanas(); if(!editId) nueva();
}

async function eliminar(id){ if(!confirm('¿Eliminar esta campaña?'))return; await fetch(`/api/campanas/${id}`,{method:'DELETE'}); loadCampanas(); nueva(); }

function insertVar(v){ const ta=document.getElementById('cMensaje'); const pos=ta.selectionStart; ta.value=ta.value.slice(0,pos)+v+ta.value.slice(ta.selectionEnd); ta.selectionStart=ta.selectionEnd=pos+v.length; ta.focus(); updatePreview(); }

function updatePreview(){
  const msg=document.getElementById('cMensaje').value||'Tu mensaje aparecerá aquí...';
  document.getElementById('prevText').textContent=msg.replace(/{{nombre}}/g,'[Nombre del negocio]').replace(/{{telefono}}/g,'[Teléfono]').replace(/{{distrito}}/g,'[Distrito]').replace(/{{provincia}}/g,'[Provincia]').replace(/{{departamento}}/g,'[Departamento]');
}

function handleFile(file){ if(!file)return; imgFile=file; const url=URL.createObjectURL(file); document.getElementById('prevImg').src=url; document.getElementById('prevImg').style.display='block'; document.getElementById('imgPreviewSmall').src=url; document.getElementById('imgPreviewSmall').style.display='block'; document.getElementById('dropLabel').style.display='none'; document.getElementById('btnQuitarImg').style.display=''; }
function handleDrop(e){ e.preventDefault(); document.getElementById('dropArea').classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) handleFile(f); }
function quitarImg(){ imgFile=null; imgUrlExistente=null; document.getElementById('prevImg').src=''; document.getElementById('prevImg').style.display='none'; document.getElementById('imgPreviewSmall').style.display='none'; document.getElementById('dropLabel').style.display=''; document.getElementById('btnQuitarImg').style.display='none'; document.getElementById('imgInput').value=''; }

loadCampanas();
</script></body></html>
