<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="/css/shared.css">
<style>
.layout{display:flex;gap:1rem;padding:1rem}
.left{width:340px;flex-shrink:0}
.right{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.625rem;margin-bottom:.875rem}
.progress-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.875rem;display:none}
.bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:8px}
.bar-f{height:100%;background:linear-gradient(90deg,var(--accent),#7c3aed);border-radius:4px;transition:width .5s}
.log-box{background:#0f172a;border-radius:8px;padding:.75rem;height:110px;overflow-y:auto;font-family:monospace;font-size:11px;color:#94a3b8;margin-top:.75rem}
.log-ok{color:#4ade80}.log-err{color:#f87171}.log-info{color:#60a5fa}
.check-item{display:flex;align-items:center;gap:8px;padding:.5rem .75rem;border-bottom:1px solid #f8fafc;cursor:pointer}
.check-item:hover{background:#f8fafc}
.check-item input{accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
.check-item .name{font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check-item .tel{font-size:11px;color:var(--muted);font-family:monospace;white-space:nowrap}
.pendientes-box{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius);padding:.875rem;margin-bottom:.75rem;display:none}
.pendientes-box p{font-size:12px;color:#92400e;margin-bottom:.5rem;font-weight:500}
@media(max-width:768px){
  .layout{flex-direction:column}
  .left{width:100%}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style></head><body>
<div class="layout">

<div class="left">
  <div class="card">
    <div class="card-h"><h3>🚀 Nuevo envío masivo</h3></div>
    <div class="card-b">
      <div class="pendientes-box" id="pendientesBox">
        <p>⚠️ <span id="numPendientes">0</span> mensajes pendientes</p>
        <button class="btn btn-sm" id="btnReintentar" onclick="reintentarPendientes()" style="width:100%;background:#f59e0b;color:#fff;justify-content:center;margin-bottom:6px">🔄 Reintentar pendientes</button>
        <button onclick="limpiarDuplicados()" style="width:100%;height:28px;background:#fef2f2;border:1px solid #fecaca;color:var(--red);border-radius:6px;font-size:11px;cursor:pointer">🗑️ Limpiar duplicados</button>
      </div>
      <div class="field"><label>Campaña / Plantilla</label>
        <select id="selCampana" onchange="loadPreview()"><option value="">— Selecciona —</option></select>
      </div>
      <div id="campPreview" style="display:none;background:#e5ddd5;border-radius:8px;padding:.75rem;margin-bottom:.75rem;font-size:12px;line-height:1.5;white-space:pre-wrap;max-height:80px;overflow-y:auto"></div>
      <div class="field"><label>Estado CRM</label>
        <select id="fEstado"><option value="">Todos los estados</option><option value="nuevo">Nuevo</option><option value="contactado">Contactado</option><option value="interesado">Interesado</option></select>
      </div>
      <div class="field"><label>Departamento</label>
        <select id="fDep"><option value="">Todos</option></select>
      </div>
      <button class="btn btn-outline" style="width:100%;justify-content:center;margin-bottom:.75rem" onclick="loadContactos()">🔍 Cargar contactos</button>
      <div id="warn" class="alert alert-warn">⚠️ Solo contactos con número registrado recibirán mensajes.</div>
      <div id="alertOk" class="alert alert-ok"></div>
      <div id="listaContactos" style="max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;display:none">
        <div style="padding:.5rem .75rem;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:11px">
          <input type="checkbox" id="selTodos" onchange="togTodos(this.checked)" style="accent-color:var(--accent);width:16px;height:16px">
          <span id="resumenSel">0 seleccionados</span>
        </div>
        <div id="contactItems"></div>
      </div>
      <button class="btn btn-primary" id="btnEnviar" onclick="iniciarEnvio()" style="width:100%;justify-content:center;margin-top:.75rem" disabled>📤 Iniciar envío masivo</button>
      <p style="font-size:11px;color:var(--faint);text-align:center;margin-top:.5rem">⏱️ 10 seg. entre mensajes para evitar bloqueos</p>
    </div>
  </div>
</div>

<div class="right">
  <div class="stats">
    <div class="stat"><div class="stat-n" id="sTotal">0</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" id="sEnv" style="color:var(--green)">0</div><div class="stat-l">Enviados</div></div>
    <div class="stat"><div class="stat-n" id="sFall" style="color:var(--red)">0</div><div class="stat-l">Fallidos</div></div>
    <div class="stat"><div class="stat-n" id="sPend" style="color:var(--yellow)">0</div><div class="stat-l">Pendientes</div></div>
  </div>

  <div class="progress-box" id="progressBox">
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
      <span id="pMsg" style="font-weight:500">Enviando...</span>
      <span id="pCount" style="color:var(--muted)"></span>
    </div>
    <div class="bar"><div class="bar-f" id="barF" style="width:0%"></div></div>
    <div class="log-box" id="logBox"></div>
  </div>

  <div class="card">
    <div class="card-h">
      <h3>📋 Historial</h3>
      <div style="display:flex;gap:6px">
        <select id="hEstado" onchange="loadHistorial()" style="height:26px;border:1px solid var(--border);border-radius:6px;font-size:11px;padding:0 6px">
          <option value="">Todos</option><option value="enviado">Enviados</option>
          <option value="fallido">Fallidos</option><option value="pendiente">Pendientes</option>
        </select>
        <button class="btn btn-outline btn-xs" onclick="loadHistorial()">🔄</button>
      </div>
    </div>
    <div class="tbl-wrap">
      <table><thead><tr><th>Negocio</th><th>Número</th><th>Campaña</th><th>Estado</th><th>Enviado</th></tr></thead>
      <tbody id="histTbody"></tbody></table>
      <div id="histEmpty" class="empty" style="display:none"><p>Sin envíos aún</p></div>
    </div>
  </div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let contactosSel=new Set(), totalEnvios=0, enviados=0, fallidos=0;

socket.on('envio:progreso',({estado,nombre,error})=>{
  const cls=estado==='enviado'?'log-ok':estado==='fallido'?'log-err':'log-info';
  logMsg((estado==='enviado'?'✓ ':'✗ ')+nombre+(error?' ('+error+')':''), cls);
  if(estado==='enviado') enviados++; else if(estado==='fallido') fallidos++;
  const prog=enviados+fallidos;
  document.getElementById('barF').style.width=(totalEnvios>0?(prog/totalEnvios*100):0)+'%';
  document.getElementById('pCount').textContent=prog+' / '+totalEnvios;
  document.getElementById('sEnv').textContent=enviados;
  document.getElementById('sFall').textContent=fallidos;
  document.getElementById('sPend').textContent=Math.max(0,totalEnvios-prog);
});
socket.on('envio:completado',()=>{
  logMsg('✅ Envío completado — '+enviados+' enviados, '+fallidos+' fallidos','log-ok');
  document.getElementById('pMsg').textContent='✅ Completado';
  document.getElementById('btnEnviar').disabled=false;
  const br=document.getElementById('btnReintentar'); if(br){br.disabled=false;br.textContent='🔄 Reintentar pendientes';}
  loadHistorial(); loadStats(); checkPendientes();
});

async function loadCampanas(){
  const data=await fetch('/api/campanas').then(r=>r.json()).catch(()=>({rows:[]}));
  const s=document.getElementById('selCampana');
  (data.rows||[]).forEach(c=>s.innerHTML+=`<option value="${c.id}" data-msg="${c.mensaje.replace(/"/g,'&quot;')}">${c.nombre}</option>`);
}
function loadPreview(){
  const opt=document.getElementById('selCampana').selectedOptions[0];
  const box=document.getElementById('campPreview');
  if(opt?.dataset?.msg){box.textContent=opt.dataset.msg;box.style.display='block';}else box.style.display='none';
}
async function loadDeps(){
  const deps=await fetch('/api/ubigeo/departamentos').then(r=>r.json()).catch(()=>[]);
  deps.forEach(d=>document.getElementById('fDep').innerHTML+=`<option value="${d}">${d}</option>`);
}
async function loadContactos(){
  const estado=document.getElementById('fEstado').value, dep=document.getElementById('fDep').value;
  const data=await fetch(`/api/negocios?limit=500${estado?'&estado_crm='+estado:''}${dep?'&dep='+encodeURIComponent(dep):''}`).then(r=>r.json()).catch(()=>({rows:[]}));
  const rows=data.rows||[];
  const conNum=rows.filter(r=>r.whatsapp||r.telefono_int||r.telefono);
  document.getElementById('warn').style.display=rows.length>conNum.length?'block':'none';
  document.getElementById('listaContactos').style.display='';
  document.getElementById('contactItems').innerHTML=conNum.map(r=>`
    <div class="check-item">
      <input type="checkbox" class="cc" data-id="${r.id}" onchange="togC(this)">
      <span class="name">${r.nombre}</span>
      <span class="tel">${r.whatsapp||r.telefono_int||r.telefono||''}</span>
    </div>`).join('');
  updResumen();
  document.getElementById('btnEnviar').disabled=false;
}
function togTodos(v){document.querySelectorAll('.cc').forEach(c=>{c.checked=v;v?contactosSel.add(+c.dataset.id):contactosSel.delete(+c.dataset.id)});updResumen();}
function togC(c){c.checked?contactosSel.add(+c.dataset.id):contactosSel.delete(+c.dataset.id);updResumen();}
function updResumen(){document.getElementById('resumenSel').textContent=contactosSel.size+' seleccionados';}

async function iniciarEnvio(){
  const campanaId=document.getElementById('selCampana').value;
  if(!campanaId) return alert('Selecciona una campaña');
  if(!contactosSel.size) return alert('Selecciona al menos un contacto');
  if(!confirm('¿Enviar a '+contactosSel.size+' contactos?\n\n⚠️ No cierres esta pestaña hasta que termine.')) return;
  totalEnvios=contactosSel.size; enviados=0; fallidos=0;
  document.getElementById('sTotal').textContent=totalEnvios;
  document.getElementById('sEnv').textContent=0; document.getElementById('sFall').textContent=0; document.getElementById('sPend').textContent=totalEnvios;
  document.getElementById('progressBox').style.display='block';
  document.getElementById('logBox').innerHTML='<div class="log-info">⏳ Iniciando envío...</div>';
  document.getElementById('barF').style.width='0%';
  document.getElementById('pMsg').textContent='Preparando...';
  document.getElementById('btnEnviar').disabled=true;
  let d;
  try{
    const r=await fetch('/api/envios/iniciar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({campana_id:+campanaId,negocio_ids:[...contactosSel]})});
    d=await r.json();
  }catch(e){logMsg('✗ Error de red: '+e.message,'log-err');document.getElementById('btnEnviar').disabled=false;return;}
  if(!d.ok){logMsg('✗ '+d.error,'log-err');document.getElementById('btnEnviar').disabled=false;return;}
  if(!d.total){logMsg('⚠️ '+(d.msg||'Todos ya recibieron esta campaña'),'log-info');document.getElementById('pMsg').textContent='Sin nuevos';document.getElementById('btnEnviar').disabled=false;return;}
  totalEnvios=d.total;
  document.getElementById('sTotal').textContent=totalEnvios;
  document.getElementById('sPend').textContent=totalEnvios;
  logMsg('✓ Envío iniciado — '+d.total+' mensajes en cola','log-ok');
  document.getElementById('pMsg').textContent='Enviando '+d.total+' mensajes...';
}

async function reintentarPendientes(){
  if(!confirm('¿Reintentar todos los mensajes pendientes?'))return;
  const btn=document.getElementById('btnReintentar');
  btn.disabled=true; btn.textContent='⏳ Reintentando...';
  const stats=await fetch('/api/envios/stats').then(r=>r.json()).catch(()=>({stats:{}}));
  totalEnvios=+(stats.stats?.pendientes||0); enviados=0; fallidos=0;
  document.getElementById('sTotal').textContent=totalEnvios;
  document.getElementById('progressBox').style.display='block';
  document.getElementById('logBox').innerHTML=`<div class="log-info">🔄 Reintentando ${totalEnvios} pendientes...</div>`;
  document.getElementById('barF').style.width='0%';
  document.getElementById('pMsg').textContent='Reintentando pendientes...';
  const r=await fetch('/api/envios/reintentar-pendientes',{method:'POST'});
  const d=await r.json();
  if(!d.ok){alert('Error: '+d.error);btn.disabled=false;btn.textContent='🔄 Reintentar pendientes';}
  else if(d.total===0){alert('Sin mensajes pendientes reales');btn.disabled=false;btn.textContent='🔄 Reintentar pendientes';checkPendientes();}
}

async function limpiarDuplicados(){
  if(!confirm('¿Limpiar duplicados de la BD?'))return;
  const r=await fetch('/api/envios/limpiar-duplicados',{method:'POST'});
  const d=await r.json();
  if(d.ok){alert('✅ Limpiados '+d.limpiados+' registros');loadHistorial();loadStats();checkPendientes();}
  else alert('Error: '+d.error);
}

async function checkPendientes(){
  const data=await fetch('/api/envios/stats').then(r=>r.json()).catch(()=>({stats:{}}));
  const p=+(data.stats?.pendientes||0);
  document.getElementById('numPendientes').textContent=p;
  document.getElementById('pendientesBox').style.display=p>0?'block':'none';
}

async function loadHistorial(){
  const estado=document.getElementById('hEstado').value;
  const data=await fetch(`/api/envios?limit=100${estado?'&estado='+estado:''}`).then(r=>r.json()).catch(()=>({rows:[]}));
  const rows=data.rows||[];
  document.getElementById('histEmpty').style.display=rows.length?'none':'block';
  document.getElementById('histTbody').innerHTML=rows.map(r=>`<tr>
    <td style="font-weight:500">${r.nombre}</td>
    <td style="font-family:monospace;font-size:11px;color:var(--accent)">${r.numero||'—'}</td>
    <td style="font-size:11px;color:var(--muted)">${r.campana_nombre||'—'}</td>
    <td><span class="badge ${r.estado==='enviado'?'b-green':r.estado==='fallido'?'b-red':'b-yellow'}">${r.estado}</span></td>
    <td style="font-size:11px;color:var(--muted)">${r.enviado_at?new Date(r.enviado_at).toLocaleString('es-PE'):'—'}</td>
  </tr>`).join('');
}
async function loadStats(){
  const data=await fetch('/api/envios/stats').then(r=>r.json()).catch(()=>({stats:{}}));
  const s=data.stats||{};
  document.getElementById('sTotal').textContent=s.total||0;
  document.getElementById('sEnv').textContent=s.enviados||0;
  document.getElementById('sFall').textContent=s.fallidos||0;
  document.getElementById('sPend').textContent=s.pendientes||0;
}
function logMsg(msg,cls){
  const log=document.getElementById('logBox');
  log.innerHTML+='<div class="'+(cls||'log-info')+'">['+new Date().toLocaleTimeString('es-PE')+'] '+msg+'</div>';
  log.scrollTop=log.scrollHeight;
}
loadCampanas(); loadDeps(); loadHistorial(); loadStats(); checkPendientes();
</script></body></html>
