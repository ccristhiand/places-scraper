<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="/css/shared.css">
<style>
.search-form{display:flex;flex-direction:column;gap:.625rem}
.search-row{display:grid;grid-template-columns:1fr 1fr;gap:.625rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.625rem;margin-bottom:.875rem}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fb{height:28px;padding:0 10px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;color:var(--muted);white-space:nowrap}
.fb.on{background:#eff6ff;border-color:#bfdbfe;color:var(--accent);font-weight:600}
.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:.625rem 1rem;border-bottom:1px solid var(--border-s)}
.phone{font-family:monospace;font-size:11px;color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;flex-shrink:0}
.saved{background:#dcfce7;color:#15803d;font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px}
.progress{display:none;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.875rem}
.bar-track{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar-fill{height:100%;background:var(--accent);width:0%;transition:width .4s;border-radius:3px}
.bar-info{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}

/* Mobile: cards instead of table */
.result-cards{display:none}
.result-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:.875rem;margin-bottom:.625rem;position:relative}
.rc-name{font-size:13px;font-weight:600;margin-bottom:3px;padding-right:24px}
.rc-sub{font-size:11px;color:var(--muted)}
.rc-check{position:absolute;top:.875rem;right:.875rem}
.rc-meta{display:flex;gap:8px;margin-top:.5rem;flex-wrap:wrap;align-items:center}

@media(max-width:640px){
  .search-row{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .tbl-wrap table{display:none}
  .result-cards{display:block}
  .filters{gap:4px}
  .fb{height:32px;font-size:12px}
}
</style></head><body>
<div class="page">

<div class="card">
  <div class="card-h"><h2>🔍 Nueva búsqueda</h2></div>
  <div class="card-b">
    <div class="search-form">
      <div class="field" style="margin-bottom:0">
        <label>¿Qué buscas?</label>
        <input id="q" placeholder="veterinaria, clínica, gimnasio...">
      </div>
      <div class="search-row">
        <div class="field" style="margin-bottom:0">
          <label>Departamento</label>
          <select id="dep" onchange="loadProv()"><option value="">— Selecciona —</option></select>
        </div>
        <div class="field" style="margin-bottom:0">
          <label>Provincia</label>
          <select id="prov" onchange="loadDist()" disabled><option value="">— Primero dep. —</option></select>
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Distrito</label>
        <select id="dist" disabled><option value="">— Todos —</option></select>
      </div>
      <button class="btn btn-primary" id="btnB" onclick="buscar()" style="width:100%;justify-content:center">
        🔍 Buscar negocios
      </button>
    </div>
  </div>
</div>

<div class="alert alert-err" id="aErr"></div>
<div class="alert alert-ok"  id="aOk"></div>

<div class="progress" id="prog">
  <div class="bar-track"><div class="bar-fill" id="bFill"></div></div>
  <div class="bar-info"><span id="bMsg">Iniciando...</span><span id="bCount"></span></div>
</div>

<div id="resSection" style="display:none">
  <div class="stats" id="statsGrid"></div>

  <div class="card">
    <div class="card-h">
      <h2 id="resTitle">Resultados</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="exportCSV()">⬇ CSV</button>
        <button class="btn btn-success btn-sm" id="btnG" onclick="guardar()">💾 Guardar</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="filters">
        <button class="fb on" onclick="fil('all',this)">Todos</button>
        <button class="fb" onclick="fil('phone',this)">📞 Tel.</button>
        <button class="fb" onclick="fil('web',this)">🌐 Web</button>
        <button class="fb" onclick="fil('high',this)">⭐ ≥4</button>
      </div>
      <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="selAll" onchange="togAll(this.checked)">
        <span id="selN" style="font-weight:600;color:var(--accent)"></span>
      </label>
    </div>

    <!-- Desktop table -->
    <div class="tbl-wrap">
      <table><thead><tr>
        <th><input type="checkbox" id="selAllH" onchange="togAll(this.checked)"></th>
        <th>#</th><th>Nombre</th><th>Teléfono</th><th>Website</th><th>Dirección</th><th>Rating</th><th>Ubicación</th>
      </tr></thead><tbody id="tbody"></tbody></table>
    </div>

    <!-- Mobile cards -->
    <div class="result-cards card-b" id="mobileCards"></div>
  </div>
</div>

</div>
<script>
let todos=[], filtrados=[], sel=new Set(), savedIds=new Set();

async function loadDeps(){
  const deps=await fetch('/api/ubigeo/departamentos').then(r=>r.json());
  const s=document.getElementById('dep');
  deps.forEach(d=>s.innerHTML+=`<option value="${d}">${d}</option>`);
}
async function loadProv(){
  const dep=document.getElementById('dep').value;
  const sp=document.getElementById('prov'), sd=document.getElementById('dist');
  sp.innerHTML='<option value="">— Selecciona —</option>'; sd.innerHTML='<option value="">— Todos —</option>';
  sp.disabled=!dep; sd.disabled=true;
  if(!dep)return;
  const provs=await fetch(`/api/ubigeo/provincias/${encodeURIComponent(dep)}`).then(r=>r.json());
  provs.forEach(p=>sp.innerHTML+=`<option value="${p}">${p}</option>`);
  sp.disabled=false;
}
async function loadDist(){
  const dep=document.getElementById('dep').value, prov=document.getElementById('prov').value;
  const sd=document.getElementById('dist');
  sd.innerHTML='<option value="">— Todos —</option>'; sd.disabled=!prov;
  if(!prov)return;
  const dists=await fetch(`/api/ubigeo/distritos/${encodeURIComponent(dep)}/${encodeURIComponent(prov)}`).then(r=>r.json());
  dists.forEach(d=>sd.innerHTML+=`<option value="${d}">${d}</option>`);
  sd.disabled=false;
}
async function buscar(){
  const q=document.getElementById('q').value.trim();
  const dep=document.getElementById('dep').value;
  if(!q) return alert('Ingresa qué deseas buscar');
  if(!dep) return alert('Selecciona un departamento');
  hide('aErr'); hide('aOk');
  const btn=document.getElementById('btnB'); btn.disabled=true; btn.textContent='⏳ Buscando...';
  document.getElementById('resSection').style.display='none';
  show('prog');
  const msgs=['Conectando...','Página 1...','Página 2...','Página 3...','Enriqueciendo...','Finalizando...'];
  let mi=0;
  const pit=setInterval(()=>{ if(mi<msgs.length){ document.getElementById('bMsg').textContent=msgs[mi]; document.getElementById('bFill').style.width=((mi+1)/msgs.length*85)+'%'; mi++; }},1500);
  try{
    const r=await fetch('/api/negocios/buscar',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({busqueda:q,departamento:dep,provincia:document.getElementById('prov').value,distrito:document.getElementById('dist').value})});
    const data=await r.json(); clearInterval(pit);
    if(!data.ok) throw new Error(data.error);
    todos=data.resultados; filtrados=[...todos]; sel.clear();
    render(); renderStats();
    document.getElementById('resTitle').textContent=`${data.total} resultados`;
    hide('prog'); show('resSection','block');
    showOk(`✅ ${data.total} negocios encontrados`);
  }catch(e){ clearInterval(pit); hide('prog'); showErr('❌ '+e.message); }
  btn.disabled=false; btn.textContent='🔍 Buscar negocios';
}
function render(){
  // Desktop table
  document.getElementById('tbody').innerHTML=filtrados.map((d,i)=>`<tr>
    <td><input type="checkbox" class="ch" data-id="${d.place_id}" ${sel.has(d.place_id)?'checked':''} onchange="togSel(this)"></td>
    <td style="color:var(--faint)">${i+1}</td>
    <td><b>${d.nombre}</b>${savedIds.has(d.place_id)?'<span class="saved">✓</span>':''}</td>
    <td>${d.telefono?`<span class="phone">${d.telefono}</span>`:'—'}</td>
    <td>${d.website?`<a href="${d.website}" target="_blank" style="font-size:11px;color:var(--accent)">${d.website.replace(/^https?:\/\//,'').split('/')[0]} ↗</a>`:'—'}</td>
    <td style="font-size:11px;color:var(--muted);max-width:160px">${d.direccion}</td>
    <td style="white-space:nowrap"><span style="color:#f59e0b">${'★'.repeat(Math.floor(d.rating||0))}</span> <span style="font-size:10px;color:var(--faint)">${d.rating||'—'}</span></td>
    <td style="font-size:11px;color:var(--muted)">${[d.distrito,d.provincia].filter(Boolean).join(', ')}</td>
  </tr>`).join('');
  // Mobile cards
  document.getElementById('mobileCards').innerHTML=filtrados.map(d=>`
    <div class="result-card">
      <input type="checkbox" class="ch rc-check" data-id="${d.place_id}" ${sel.has(d.place_id)?'checked':''} onchange="togSel(this)">
      <div class="rc-name">${d.nombre}${savedIds.has(d.place_id)?'<span class="saved">✓</span>':''}</div>
      <div class="rc-sub">📍 ${d.direccion||'—'}</div>
      <div class="rc-meta">
        ${d.telefono?`<span class="phone">📞 ${d.telefono}</span>`:''}
        ${d.rating?`<span style="color:#f59e0b;font-size:12px">${'★'.repeat(Math.floor(d.rating))} ${d.rating}</span>`:''}
        ${d.website?`<a href="${d.website}" target="_blank" style="font-size:11px;color:var(--accent)">🌐 web</a>`:''}
      </div>
    </div>`).join('');
  updSelN();
}
function renderStats(){
  const ct=filtrados.filter(d=>d.telefono).length, cw=filtrados.filter(d=>d.website).length;
  const rr=filtrados.filter(d=>d.rating); const pr=rr.length?(rr.reduce((a,d)=>a+d.rating,0)/rr.length).toFixed(1):'—';
  document.getElementById('statsGrid').innerHTML=
    [{n:filtrados.length,l:'encontrados'},{n:ct,l:'con teléfono'},{n:cw,l:'con website'},{n:pr,l:'rating prom.'}]
    .map(s=>`<div class="stat"><div class="stat-n">${s.n}</div><div class="stat-l">${s.l}</div></div>`).join('');
}
function fil(t,btn){ document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
  const fns={all:()=>true,phone:d=>d.telefono,web:d=>d.website,high:d=>d.rating>=4};
  filtrados=todos.filter(fns[t]||fns.all); render(); }
function togAll(v){ document.querySelectorAll('.ch').forEach(c=>{c.checked=v; v?sel.add(c.dataset.id):sel.delete(c.dataset.id)});
  document.getElementById('selAll').checked=v; document.getElementById('selAllH').checked=v; updSelN(); }
function togSel(c){ c.checked?sel.add(c.dataset.id):sel.delete(c.dataset.id); updSelN(); }
function updSelN(){ const n=sel.size; document.getElementById('selN').textContent=n>0?`${n} sel.`:'';
  document.getElementById('btnG').textContent=n>0?`💾 Guardar ${n}`:'💾 Guardar'; }
async function guardar(){
  if(!sel.size) return alert('Selecciona al menos uno');
  const regs=todos.filter(d=>sel.has(d.place_id));
  const btn=document.getElementById('btnG'); btn.disabled=true; btn.textContent='⏳...';
  const r=await fetch('/api/negocios/guardar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registros:regs,rubro:document.getElementById('q').value.trim()})});
  const data=await r.json();
  if(data.ok){ regs.forEach(r=>savedIds.add(r.place_id)); render(); showOk(`✅ ${data.insertados} nuevos, ${data.duplicados} ya existían`); togAll(false); }
  else showErr('❌ '+data.error);
  btn.disabled=false; updSelN();
}
function exportCSV(){
  const h=['Nombre','Teléfono','Website','Dirección','Rating','Departamento','Provincia','Distrito'];
  const rows=filtrados.map(d=>[d.nombre,d.telefono,d.website,d.direccion,d.rating,d.departamento,d.provincia,d.distrito].map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(','));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\uFEFF'+[h.join(','),...rows].join('\n')],{type:'text/csv'})); a.download=`busqueda_${Date.now()}.csv`; a.click();
}
function show(id,d='block'){document.getElementById(id).style.display=d}
function hide(id){document.getElementById(id).style.display='none'}
function showOk(m){const el=document.getElementById('aOk');el.textContent=m;el.style.display='block';setTimeout(()=>el.style.display='none',5000)}
function showErr(m){const el=document.getElementById('aErr');el.textContent=m;el.style.display='block'}
loadDeps();
</script></body></html>
