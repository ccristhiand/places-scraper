<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="/css/shared.css">
<style>
.layout{display:flex;gap:1rem;height:calc(100vh - 52px);overflow:hidden}
.left{flex:1;min-width:0;display:flex;flex-direction:column;gap:.625rem;overflow:hidden}
.right{width:320px;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;gap:.625rem}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:.625rem;background:#fff;border-bottom:1px solid var(--border)}
.fi{height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff}
.fi:focus{outline:none;border-color:var(--accent)}
.scroll{overflow-y:auto;flex:1}
.hist-item{display:flex;gap:8px;padding:.625rem 0;border-bottom:1px solid var(--border-s)}
.hist-ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.hist-body{flex:1;min-width:0}
.hist-tipo{font-size:11px;font-weight:600;color:var(--text)}
.hist-txt{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
.hist-ts{font-size:10px;color:var(--faint);margin-top:2px}
/* Mobile */
.contact-cards{display:none}
.cc{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:.875rem;margin-bottom:.5rem;cursor:pointer}
.cc.active{border-color:var(--accent);background:#eff6ff}
.cc-name{font-size:13px;font-weight:600}
.cc-sub{font-size:11px;color:var(--muted);margin-top:2px}
.cc-badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:600;margin-top:4px}
.panel-mobile{display:none;position:fixed;inset:0;background:#fff;z-index:50;flex-direction:column;overflow-y:auto}
.panel-mobile-h{padding:.875rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff}
@media(max-width:768px){
  .layout{flex-direction:column;height:auto;overflow:visible}
  .left{overflow:visible}
  .right{width:100%;display:none}
  .tbl-wrap table{display:none}
  .contact-cards{display:block;padding:.625rem}
  .panel-mobile{display:none}
  .panel-mobile.open{display:flex}
}
</style></head><body>
<div class="page" style="padding:0">
<div class="layout">

<div class="left">
  <div class="filters">
    <input class="fi" id="fQ" placeholder="🔍 Nombre o teléfono..." oninput="load()" style="min-width:160px;flex:1">
    <select class="fi" id="fDep" onchange="load()"><option value="">Todos dep.</option></select>
    <select class="fi" id="fEstado" onchange="load()">
      <option value="">Todos estados</option>
      <option value="nuevo">🆕 Nuevo</option><option value="contactado">📞 Contactado</option>
      <option value="interesado">⭐ Interesado</option><option value="propuesta">📄 Propuesta</option>
      <option value="cerrado">✅ Cerrado</option><option value="descartado">❌ Descartado</option>
    </select>
    <span id="total" style="font-size:11px;color:var(--faint);align-self:center;white-space:nowrap"></span>
  </div>

  <!-- Desktop table -->
  <div class="tbl-wrap scroll" style="flex:1">
    <table><thead><tr>
      <th>Nombre</th><th>Teléfono</th><th>WA</th><th>Ubicación</th><th>Estado CRM</th><th>Rubro</th><th></th>
    </tr></thead><tbody id="tbody"></tbody></table>
    <div class="empty" id="emptyDesk" style="display:none"><div class="empty-icon">👥</div><p>Sin contactos guardados</p></div>
  </div>

  <!-- Mobile cards -->
  <div class="contact-cards" id="mobileList"></div>
</div>

<!-- Desktop right panel -->
<div class="right" id="rightPanel">
  <div class="card" id="panelVacio">
    <div class="card-b" style="text-align:center;padding:2rem">
      <div style="font-size:32px;margin-bottom:.5rem">👆</div>
      <p style="font-size:13px;color:var(--muted)">Selecciona un contacto para ver su historial</p>
    </div>
  </div>
  <div id="panelDetalle" style="display:none">
    <div class="card">
      <div class="card-h"><h3 id="detNombre" style="font-size:13px">—</h3></div>
      <div class="card-b" style="display:flex;flex-direction:column;gap:8px">
        <div style="font-size:12px;color:var(--muted)" id="detInfo"></div>
        <select id="detEstado" onchange="cambiarEstado()" style="height:34px;border:1px solid var(--border);border-radius:6px;font-size:12px;padding:0 8px">
          <option value="nuevo">🆕 Nuevo</option><option value="contactado">📞 Contactado</option>
          <option value="interesado">⭐ Interesado</option><option value="propuesta">📄 Propuesta</option>
          <option value="cerrado">✅ Cerrado</option><option value="descartado">❌ Descartado</option>
        </select>
        <div style="display:flex;gap:6px">
          <button class="btn btn-outline btn-sm" onclick="openDemo()" style="flex:1;justify-content:center">📅 Demo</button>
          <button class="btn btn-outline btn-sm" onclick="irChat()" style="flex:1;justify-content:center">💬 Chat</button>
        </div>
        <input id="detWA" placeholder="WA: 51XXXXXXXXX" style="height:32px;border:1px solid var(--border);border-radius:6px;font-size:12px;padding:0 8px;width:100%">
        <button onclick="guardarWA()" class="btn btn-success btn-sm" style="width:100%;justify-content:center">Guardar número WA</button>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>📝 Agregar nota</h3></div>
      <div class="card-b">
        <select id="tipoNota" style="width:100%;height:32px;border:1px solid var(--border);border-radius:6px;font-size:12px;padding:0 8px;margin-bottom:6px">
          <option value="comentario">💬 Comentario</option>
          <option value="llamada">📞 Llamada</option>
          <option value="mensaje">📤 Mensaje</option>
        </select>
        <textarea id="notaTxt" placeholder="Escribe tu nota..." style="width:100%;height:70px;border:1px solid var(--border);border-radius:6px;font-size:12px;padding:8px;resize:none;font-family:inherit"></textarea>
        <button onclick="addNota()" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px">Guardar nota</button>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>📋 Historial</h3></div>
      <div id="historial" style="padding:.5rem 1rem;max-height:280px;overflow-y:auto"></div>
    </div>
  </div>
</div>

</div>

<!-- Mobile detail panel -->
<div class="panel-mobile" id="panelMobile">
  <div class="panel-mobile-h">
    <button onclick="closeMobilePanel()" style="background:none;border:none;font-size:22px;cursor:pointer">←</button>
    <h3 id="mobileDetNombre" style="font-size:14px;font-weight:600;flex:1"></h3>
  </div>
  <div style="padding:1rem;display:flex;flex-direction:column;gap:.875rem">
    <div class="card" style="margin-bottom:0">
      <div class="card-b" style="display:flex;flex-direction:column;gap:8px">
        <div style="font-size:12px;color:var(--muted)" id="mobileDetInfo"></div>
        <select id="mobileDetEstado" onchange="cambiarEstadoMobile()" style="height:42px;border:1px solid var(--border);border-radius:8px;font-size:14px;padding:0 10px">
          <option value="nuevo">🆕 Nuevo</option><option value="contactado">📞 Contactado</option>
          <option value="interesado">⭐ Interesado</option><option value="propuesta">📄 Propuesta</option>
          <option value="cerrado">✅ Cerrado</option><option value="descartado">❌ Descartado</option>
        </select>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button class="btn btn-outline" onclick="openDemo()" style="justify-content:center">📅 Demo</button>
          <button class="btn btn-outline" onclick="irChat()" style="justify-content:center">💬 Chat</button>
        </div>
        <input id="mobileDetWA" placeholder="WA: 51XXXXXXXXX" style="height:42px;border:1px solid var(--border);border-radius:8px;font-size:14px;padding:0 10px;width:100%">
        <button onclick="guardarWAMobile()" class="btn btn-success" style="width:100%;justify-content:center">Guardar número WA</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:0">
      <div class="card-h"><h3>📝 Nota</h3></div>
      <div class="card-b">
        <select id="tipoNotaMobile" style="width:100%;height:42px;border:1px solid var(--border);border-radius:8px;font-size:14px;padding:0 10px;margin-bottom:8px">
          <option value="comentario">💬 Comentario</option><option value="llamada">📞 Llamada</option><option value="mensaje">📤 Mensaje</option>
        </select>
        <textarea id="notaTxtMobile" placeholder="Escribe tu nota..." style="width:100%;height:80px;border:1px solid var(--border);border-radius:8px;font-size:14px;padding:10px;resize:none;font-family:inherit"></textarea>
        <button onclick="addNotaMobile()" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">Guardar nota</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:0">
      <div class="card-h"><h3>📋 Historial</h3></div>
      <div id="historialMobile" style="padding:.5rem 1rem"></div>
    </div>
  </div>
</div>

<!-- Demo modal -->
<div id="demoModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center">
  <div style="background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:1.25rem;max-height:90vh;overflow-y:auto">
    <div style="font-weight:600;font-size:14px;margin-bottom:1rem">📅 Agendar demo</div>
    <div class="field"><label>Título</label><input id="dTitulo" placeholder="Demo / Presentación..."></div>
    <div class="field"><label>Fecha y hora</label><input id="dFecha" type="datetime-local"></div>
    <div class="field"><label>Tipo</label>
      <select id="dTipo"><option value="virtual">🖥️ Virtual</option><option value="presencial">🏢 Presencial</option><option value="telefonica">📞 Telefónica</option></select>
    </div>
    <div class="field"><label>Enlace (Zoom/Meet)</label><input id="dEnlace" placeholder="https://..."></div>
    <div class="field"><label>Responsable</label><input id="dResp" placeholder="Tu nombre"></div>
    <div style="display:flex;gap:8px;margin-top:.5rem">
      <button onclick="document.getElementById('demoModal').style.display='none'" class="btn btn-outline" style="flex:1;justify-content:center">Cancelar</button>
      <button onclick="guardarDemo()" class="btn btn-primary" style="flex:1;justify-content:center">Agendar</button>
    </div>
  </div>
</div>
</div>

<script>
let activo=null;
const CRM_C={nuevo:'b-blue',contactado:'b-yellow',interesado:'b-orange',propuesta:'b-purple',cerrado:'b-green',descartado:'b-red'};
const CRM_L={nuevo:'🆕 Nuevo',contactado:'📞 Contactado',interesado:'⭐ Interesado',propuesta:'📄 Propuesta',cerrado:'✅ Cerrado',descartado:'❌ Descartado'};
const HIST_I={estado:'🔄',comentario:'💬',llamada:'📞',demo:'📅',mensaje:'📤'};
const HIST_C={estado:'#dbeafe',comentario:'#f1f5f9',llamada:'#fef9c3',demo:'#f3e8ff',mensaje:'#dcfce7'};

async function load(){
  const q=document.getElementById('fQ').value, dep=document.getElementById('fDep').value, estado=document.getElementById('fEstado').value;
  const url=`/api/negocios?limit=300${q?'&q='+encodeURIComponent(q):''}${dep?'&dep='+encodeURIComponent(dep):''}${estado?'&estado_crm='+estado:''}`;
  const data=await fetch(url).then(r=>r.json()).catch(()=>({rows:[]}));
  const rows=data.rows||[];
  document.getElementById('total').textContent=rows.length+' contactos';
  document.getElementById('emptyDesk').style.display=rows.length?'none':'block';
  // Desktop
  document.getElementById('tbody').innerHTML=rows.map(r=>`<tr onclick="selRow(${JSON.stringify(r).replace(/"/g,'&quot;')})" style="cursor:pointer" ${activo?.id===r.id?'class="selected"':''}>
    <td><b>${r.nombre}</b></td>
    <td><span style="font-family:monospace;font-size:11px;color:var(--accent)">${r.telefono||'—'}</span></td>
    <td style="font-size:11px">${r.whatsapp||'—'}</td>
    <td style="font-size:11px;color:var(--muted)">${[r.distrito,r.provincia].filter(Boolean).join(', ')||'—'}</td>
    <td><span class="badge ${CRM_C[r.estado_crm]||'b-blue'}">${CRM_L[r.estado_crm]||r.estado_crm}</span></td>
    <td style="font-size:11px;color:var(--muted)">${r.rubro_busqueda||'—'}</td>
    <td><button class="btn btn-outline btn-xs" onclick="event.stopPropagation();selRow(${JSON.stringify(r).replace(/"/g,'&quot;')})">Ver</button></td>
  </tr>`).join('');
  // Mobile cards
  document.getElementById('mobileList').innerHTML=rows.map(r=>`
    <div class="cc ${activo?.id===r.id?'active':''}" onclick="selRowMobile(${JSON.stringify(r).replace(/"/g,'&quot;')})">
      <div class="cc-name">${r.nombre}</div>
      <div class="cc-sub">📞 ${r.telefono||'—'} · 📍 ${[r.distrito,r.provincia].filter(Boolean).join(', ')||'—'}</div>
      <span class="cc-badge ${CRM_C[r.estado_crm]||'b-blue'}">${CRM_L[r.estado_crm]||r.estado_crm}</span>
    </div>`).join('');
}

function selRow(r){
  activo=r;
  document.getElementById('panelVacio').style.display='none';
  document.getElementById('panelDetalle').style.display='';
  document.getElementById('detNombre').textContent=r.nombre;
  document.getElementById('detInfo').innerHTML=`📞 ${r.telefono||'—'} · 📍 ${[r.distrito,r.provincia,r.departamento].filter(Boolean).join(', ')||'—'}`;
  document.getElementById('detEstado').value=r.estado_crm||'nuevo';
  document.getElementById('detWA').value=r.whatsapp||'';
  loadHistorial(r.id);
}

function selRowMobile(r){
  activo=r;
  document.getElementById('mobileDetNombre').textContent=r.nombre;
  document.getElementById('mobileDetInfo').innerHTML=`📞 ${r.telefono||'—'} · 📍 ${[r.distrito,r.provincia].filter(Boolean).join(', ')||'—'}`;
  document.getElementById('mobileDetEstado').value=r.estado_crm||'nuevo';
  document.getElementById('mobileDetWA').value=r.whatsapp||'';
  document.getElementById('panelMobile').classList.add('open');
  loadHistorialEl(r.id, 'historialMobile');
}
function closeMobilePanel(){ document.getElementById('panelMobile').classList.remove('open'); }

async function loadHistorial(id){ loadHistorialEl(id,'historial'); }
async function loadHistorialEl(id,elId){
  const data=await fetch(`/api/crm/${id}`).then(r=>r.json()).catch(()=>({historial:[]}));
  const items=data.historial||[];
  document.getElementById(elId).innerHTML=items.length?items.map(h=>`
    <div class="hist-item">
      <div class="hist-ico" style="background:${HIST_C[h.tipo]||'#f1f5f9'}">${HIST_I[h.tipo]||'📌'}</div>
      <div class="hist-body">
        <div class="hist-tipo">${h.tipo}${h.usuario?' · '+h.usuario:''}</div>
        <div class="hist-txt">${h.contenido||''}</div>
        <div class="hist-ts">${new Date(h.created_at).toLocaleString('es-PE')}</div>
      </div>
    </div>`).join(''):'<div style="text-align:center;padding:1rem;color:var(--faint);font-size:12px">Sin historial</div>';
}

async function cambiarEstado(){
  if(!activo)return;
  await fetch(`/api/negocios/${activo.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado_crm:document.getElementById('detEstado').value})});
  activo.estado_crm=document.getElementById('detEstado').value; load(); loadHistorial(activo.id);
}
async function cambiarEstadoMobile(){
  if(!activo)return;
  await fetch(`/api/negocios/${activo.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado_crm:document.getElementById('mobileDetEstado').value})});
  activo.estado_crm=document.getElementById('mobileDetEstado').value; load();
}
async function guardarWA(){ if(!activo)return; const wa=document.getElementById('detWA').value.trim(); await fetch(`/api/negocios/${activo.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({whatsapp:wa})}); alert('✅ Guardado'); }
async function guardarWAMobile(){ if(!activo)return; const wa=document.getElementById('mobileDetWA').value.trim(); await fetch(`/api/negocios/${activo.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({whatsapp:wa})}); alert('✅ Guardado'); }
async function addNota(){ if(!activo)return; const txt=document.getElementById('notaTxt').value.trim(),tipo=document.getElementById('tipoNota').value; if(!txt)return alert('Escribe una nota'); await fetch(`/api/crm/${activo.id}/comentario`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contenido:txt,tipo})}); document.getElementById('notaTxt').value=''; loadHistorial(activo.id); }
async function addNotaMobile(){ if(!activo)return; const txt=document.getElementById('notaTxtMobile').value.trim(),tipo=document.getElementById('tipoNotaMobile').value; if(!txt)return alert('Escribe una nota'); await fetch(`/api/crm/${activo.id}/comentario`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contenido:txt,tipo})}); document.getElementById('notaTxtMobile').value=''; loadHistorialEl(activo.id,'historialMobile'); }
function openDemo(){ if(!activo)return; document.getElementById('demoModal').style.display='flex'; }
async function guardarDemo(){
  if(!activo)return;
  const body={negocio_id:activo.id,titulo:document.getElementById('dTitulo').value||'Demo',fecha_hora:document.getElementById('dFecha').value,tipo:document.getElementById('dTipo').value,enlace:document.getElementById('dEnlace').value,responsable:document.getElementById('dResp').value};
  if(!body.fecha_hora)return alert('Selecciona fecha y hora');
  await fetch('/api/demos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  document.getElementById('demoModal').style.display='none';
  alert('✅ Demo agendada con recordatorio automático por WA');
  loadHistorial(activo.id);
}
function irChat(){ if(!activo)return; window.parent.postMessage({nav:'chat',id:activo.id},'*'); closeMobilePanel(); }
async function initFiltros(){
  const deps=await fetch('/api/ubigeo/departamentos').then(r=>r.json()).catch(()=>[]);
  deps.forEach(d=>document.getElementById('fDep').innerHTML+=`<option value="${d}">${d}</option>`);
}
initFiltros(); load();
</script></body></html>
